name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Carimbar versao do site
        run: |
          BUILD="${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          sed -i "s/__BUILD_ID__/${BUILD}/g" index.html
          printf '{"build":"%s","em":"%s"}' "$BUILD" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > versao.json

      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
